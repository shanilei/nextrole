name: Collect jobs

on:
  schedule:
    # 05:17 UTC = 07:17/08:17 in Israel, every day
    - cron: '17 5 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/**'
      - 'companies.json'
      - '.github/workflows/collect.yml'

permissions:
  contents: write

concurrency:
  group: collect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test filters
        run: npm test

      - name: Collect
        run: npm run collect
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          # Full Google Jobs budget only on the daily run, to save the 250 free searches a month.
          SERPAPI_MAX_SEARCHES: ${{ github.event_name == 'schedule' && '6' || '2' }}
          DEBUG_FEEDS: ${{ github.event_name == 'pull_request' && '1' || '' }}

      # On pull requests this is a dry run: results show in the run summary only.
      - name: Commit updated data
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "nextrole-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: daily job update $(date -u +%F)"
            git push
          fi
