name: Deploy app

on:
  push:
    branches: [main]
    paths: ['app/**', 'data/**', '.github/workflows/pages.yml']
  # The daily collector commits with GITHUB_TOKEN, which does not trigger `push`,
  # so redeploy whenever a collect run on main finishes.
  workflow_run:
    workflows: ['Collect jobs']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Build site
        run: |
          mkdir -p _site/data
          cp -r app/. _site/
          cp data/*.json _site/data/ 2>/dev/null || true
          [ -f _site/data/jobs.json ] || echo '{"jobs":[]}' > _site/data/jobs.json
          rm -f _site/data/report.json _site/data/boards.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
