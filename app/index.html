<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NextRole</title>
  <meta name="description" content="משרות UX ו-Product Design בישראל, מתעדכן כל בוקר">
  <meta name="theme-color" content="#F3F4F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1120" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="NextRole">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=Assistant:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <header>
      <div class="head-row">
        <div>
          <h1>NextRole</h1>
          <p class="sub" id="updated">טוען משרות…</p>
        </div>
      </div>
      <div class="stats" id="stats"></div>
      <label class="search">
        <span class="visually-hidden">חיפוש</span>
        <input id="q" type="search" placeholder="חיפוש חברה או תפקיד" autocomplete="off">
      </label>
      <div class="chips" role="group" aria-label="סינון" id="chips"></div>
    </header>
    <main class="list" id="list" aria-live="polite"></main>
    <footer class="foot">
      הסטטוסים וההערות נשמרים במכשיר הזה. המשרות מתעדכנות כל בוקר מאתרי הגיוס של החברות.
    </footer>
  </div>
  <script src="app.js" type="module"></script>
</body>
</html>
